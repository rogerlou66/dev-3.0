name: Android client

on:
  pull_request:
    paths:
      - "android/**"
      - "src/mainview/android-client-bridge.ts"
      - "src/mainview/commands.ts"
      - "src/mainview/terminal-path-open.ts"
      - "src/mainview/components/FilePreviewModal.tsx"
      - "src/mainview/components/TaskArtifactViewer.tsx"
      - "src/mainview/components/TaskTerminal.tsx"
      - "src/mainview/components/ProjectTerminal.tsx"
      - "src/bun/artifact-download-tickets.ts"
      - "src/bun/remote-access-server.ts"
      - "src/bun/rpc-handlers/app-handlers.ts"
      - "src/bun/shared-artifacts.ts"
      - "src/shared/types.ts"
      - ".github/workflows/android-client.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/mainview/android-client-bridge.ts"
      - "src/mainview/commands.ts"
      - "src/mainview/terminal-path-open.ts"
      - "src/mainview/components/FilePreviewModal.tsx"
      - "src/mainview/components/TaskArtifactViewer.tsx"
      - "src/mainview/components/TaskTerminal.tsx"
      - "src/mainview/components/ProjectTerminal.tsx"
      - "src/bun/artifact-download-tickets.ts"
      - "src/bun/remote-access-server.ts"
      - "src/bun/rpc-handlers/app-handlers.ts"
      - "src/bun/shared-artifacts.ts"
      - "src/shared/types.ts"
      - ".github/workflows/android-client.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install host dependencies
        uses: ./.github/actions/bun-install
        with:
          frozen-lockfile: "true"
      - name: Test Android host integration
        run: >-
          bunx vitest run
          src/mainview/__tests__/android-client-bridge.test.ts
          src/mainview/__tests__/agent-message-delivery.test.ts
          src/mainview/__tests__/commands.test.ts
          src/mainview/__tests__/terminal-path-open.test.ts
          src/mainview/components/__tests__/FilePreviewModal.test.tsx
          src/mainview/components/__tests__/ProjectTerminal.test.tsx
          src/mainview/components/__tests__/TaskArtifactViewer.test.tsx
          src/mainview/components/__tests__/TaskTerminal.test.tsx
        working-directory: .
      - name: Test Android download host
        run: >-
          bunx vitest run --config vitest.config.bun.ts
          src/bun/__tests__/artifact-download-tickets.test.ts
          src/bun/__tests__/remote-access-auth.test.ts
          src/bun/__tests__/shared-artifacts.test.ts
        working-directory: .
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Test and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev3-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
